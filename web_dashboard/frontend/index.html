<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Persona Chatbot Platform - Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Axios -->
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    
    <style>
        /* Custom animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out;
        }
        
        /* Chat bubble animations */
        .chat-bubble {
            transition: all 0.2s ease;
        }
        
        /* Memory card hover effect */
        .memory-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script>
        // =============================================
        // DISCORD PERSONA CHATBOT PLATFORM - DASHBOARD
        // =============================================
        
        const { useState, useEffect, useMemo } = React;
        
        // API Configuration
        const API_BASE = '/api';  // Change to 'http://localhost:3001/api' in production
        
        // =============================================
        // AUTH CONTEXT
        // =============================================
        
        const AuthContext = React.createContext();
        
        // =============================================
        // MAIN APP COMPONENT
        // =============================================
        
        function App() {
            const [user, setUser] = useState(null);
            const [bots, setBots] = useState([]);
            const [view, setView] = useState('dashboard');  // dashboard, create-bot, edit-bot, chat-preview, memories, settings
            const [selectedBot, setSelectedBot] = useState(null);
            const [loading, setLoading] = useState(false);
            
            // Load user on mount
            useEffect(() => {
                checkAuth();
                
                // Load initial bots list
                loadBots();
            }, []);
            
            // Check authentication token
            async function checkAuth() {
                try {
                    const response = await axios.get(`${API_BASE}/auth/me`, {
                        headers: { 
                            Authorization: `Bearer ${localStorage.getItem('token')}` 
                        }
                    });
                    setUser(response.data);
                } catch (error) {
                    console.log('Not authenticated');
                }
            }
            
            // Login handler
            async function login(email, password) {
                setLoading(true);
                const response = await axios.post(`${API_BASE}/auth/login`, { email, password });
                localStorage.setItem('token', response.data.token);
                setUser(response.data.user);
                setLoading(false);
                setView('dashboard');
            }
            
            // Register handler
            async function register(email, password, fullName) {
                setLoading(true);
                const response = await axios.post(`${API_BASE}/auth/register`, { email, password, fullName });
                localStorage.setItem('token', response.data.token);
                setUser(response.data.user);
                setLoading(false);
                setView('dashboard');
            }
            
            // Logout handler
            function logout() {
                localStorage.removeItem('token');
                setUser(null);
                setSelectedBot(null);
                setBots([]);
            }
            
            // Load bots list
            async function loadBots(activeOnly = false) {
                const query = activeOnly ? '?isActive=true' : '';
                try {
                    const response = await axios.get(`${API_BASE}/bots${query}`, {
                        headers: { Authorization: `Bearer ${localStorage.getItem('token')}` }
                    });
                    setBots(response.data);
                } catch (error) {
                    console.error('Failed to load bots:', error.message);
                }
            }
            
            // Select bot for editing
            function selectBot(botId) {
                const bot = bots.find(b => b.id === botId);
                if (bot) {
                    setSelectedBot(bot);
                    setView(`edit-bot-${botId}`);
                }
            }
            
            // =============================================
            // AUTH FORM COMPONENT
            // =============================================
            
            function LoginForm() {
                const [email, setEmail] = useState('');
                const [password, setPassword] = useState('');
                
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 to-purple-700">
                        <div className="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md animate-fade-in">
                            <div className="text-center mb-8">
                                <h1 className="text-3xl font-bold text-gray-800">🤖 Discord Persona Platform</h1>
                                <p className="text-gray-600 mt-2">Welcome back! Sign in to manage your bots.</p>
                            </div>
                            
                            <form onSubmit={(e) => { e.preventDefault(); login(email, password); }}>
                                <div className="mb-4">
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                                    <input 
                                        type="email" 
                                        value={email}
                                        onChange={(e) => setEmail(e.target.value)}
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        placeholder="you@example.com"
                                    />
                                </div>
                                
                                <div className="mb-6">
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Password</label>
                                    <input 
                                        type="password" 
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        placeholder="••••••••"
                                    />
                                </div>
                                
                                <button 
                                    type="submit"
                                    disabled={loading}
                                    className="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 rounded-lg font-semibold hover:from-blue-700 hover:to-purple-700 transition-all disabled:opacity-50"
                                >
                                    {loading ? 'Signing in...' : 'Sign In'}
                                </button>
                            </form>
                            
                            <div className="mt-6 text-center">
                                <p className="text-gray-600">Don't have an account?</p>
                                <button 
                                    onClick={() => setView('register')}
                                    className="text-blue-600 hover:text-blue-700 font-semibold mt-1"
                                >
                                    Create new account →
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }
            
            // =============================================
            // REGISTER FORM COMPONENT
            // =============================================
            
            function RegisterForm() {
                const [email, setEmail] = useState('');
                const [password, setPassword] = useState('');
                const [fullName, setFullName] = useState('');
                
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 to-purple-700">
                        <div className="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md animate-fade-in">
                            <div className="text-center mb-8">
                                <h1 className="text-3xl font-bold text-gray-800">🤖 Create Account</h1>
                                <p className="text-gray-600 mt-2">Join the Discord Persona Platform!</p>
                            </div>
                            
                            <form onSubmit={(e) => { e.preventDefault(); register(email, password, fullName); }}>
                                <div className="mb-4">
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
                                    <input 
                                        type="text" 
                                        value={fullName}
                                        onChange={(e) => setFullName(e.target.value)}
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        placeholder="Your name"
                                    />
                                </div>
                                
                                <div className="mb-4">
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                                    <input 
                                        type="email" 
                                        value={email}
                                        onChange={(e) => setEmail(e.target.value)}
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        placeholder="you@example.com"
                                    />
                                </div>
                                
                                <div className="mb-6">
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Password</label>
                                    <input 
                                        type="password" 
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        placeholder="••••••••"
                                    />
                                </div>
                                
                                <button 
                                    type="submit"
                                    disabled={loading}
                                    className="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 rounded-lg font-semibold hover:from-blue-700 hover:to-purple-700 transition-all disabled:opacity-50"
                                >
                                    {loading ? 'Creating account...' : 'Create Account'}
                                </button>
                            </form>
                            
                            <div className="mt-6 text-center">
                                <p className="text-gray-600">Already have an account?</p>
                                <button 
                                    onClick={() => setView('dashboard')}
                                    className="text-blue-600 hover:text-blue-700 font-semibold mt-1"
                                >
                                    Sign in →
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }
            
            // =============================================
            // DASHBOARD HOME COMPONENT
            // =============================================
            
            function DashboardHome() {
                return (
                    <div className="space-y-8 animate-fade-in">
                        {/* Header */}
                        <div className="bg-gradient-to-r from-blue-600 to-purple-700 text-white p-8 rounded-2xl shadow-xl">
                            <h1 className="text-4xl font-bold mb-2">🤖 Persona Chatbot Dashboard</h1>
                            <p className="opacity-90">Create, manage, and deploy your autonomous Discord chatbots to the cloud!</p>
                        </div>
                        
                        {/* Quick Actions */}
                        <div className="grid md:grid-cols-2 gap-6">
                            <button 
                                onClick={() => setView('create-bot')}
                                className="bg-gradient-to-r from-blue-500 to-cyan-600 text-white p-8 rounded-2xl shadow-lg hover:shadow-xl transition-all transform hover:scale-[1.02]"
                            >
                                <h2 className="text-2xl font-bold mb-2">🎭 Create New Bot</h2>
                                <p>Start building your AI persona with full customization!</p>
                            </button>
                            
                            <button 
                                onClick={() => setView('discards')}
                                className="bg-gradient-to-r from-purple-500 to-pink-600 text-white p-8 rounded-2xl shadow-lg hover:shadow-xl transition-all transform hover:scale-[1.02]"
                            >
                                <h2 className="text-2xl font-bold mb-2">🧠 Memory Manager</h2>
                                <p>View and manage your bot's long-term memories!</p>
                            </button>
                        </div>
                        
                        {/* Bot List */}
                        <div className="bg-white rounded-2xl shadow-lg p-6">
                            <h2 className="text-2xl font-bold text-gray-800 mb-4 flex items-center">
                                🤖 Your Bots ({bots.length})
                            </h2>
                            
                            {bots.length === 0 ? (
                                <div className="text-center py-12">
                                    <p className="text-gray-500 mb-4">You haven't created any bots yet.</p>
                                    <button 
                                        onClick={() => setView('create-bot')}
                                        className="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 transition"
                                    >
                                        Create your first bot!
                                    </button>
                                </div>
                            ) : (
                                <div className="grid md:grid-cols-2 gap-4">
                                    {bots.map(bot => (
                                        <div 
                                            key={bot.id}
                                            onClick={() => selectBot(bot.id)}
                                            className="bg-gray-50 p-6 rounded-xl cursor-pointer hover:bg-blue-50 transition-all border border-transparent hover:border-blue-300"
                                        >
                                            <h3 className="text-xl font-bold text-gray-800">{bot.name}</h3>
                                            <p className="text-sm text-gray-600 mt-1">Speech Style: {bot.speechStyle || 'Default'}</p>
                                            
                                            <div className="mt-3 flex items-center space-x-4 text-sm">
                                                <span className={`px-2 py-1 rounded ${bot.isActive ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}`}>
                                                    {bot.isActive ? '✓ Active' : '○ Paused'}
                                                </span>
                                                
                                                <span className="px-2 py-1 rounded bg-blue-100 text-blue-700">
                                                    💬 {bot.memoryCount} memories
                                                </span>
                                                
                                                <span className="px-2 py-1 rounded bg-purple-100 text-purple-700">
                                                    🔒 {bot.explicitContentMode}
                                                </span>
                                            </div>
                                            
                                            <div className="mt-3 flex space-x-2">
                                                <button 
                                                    onClick={(e) => { e.stopPropagation(); selectBot(bot.id); }}
                                                    className="flex-1 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition font-semibold"
                                                >
                                                    Edit
                                                </button>
                                                
                                                <button 
                                                    onClick={(e) => { e.stopPropagation(); setView(`chat-preview-${bot.id}`); }}
                                                    className="flex-1 bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition font-semibold"
                                                >
                                                    Chat Preview
                                                </button>
                                                
                                                <button 
                                                    onClick={(e) => { e.stopPropagation(); setView('memories'); }}
                                                    className="flex-1 bg-purple-600 text-white py-2 rounded-lg hover:bg-purple-700 transition font-semibold"
                                                >
                                                    Memories
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                );
            }
            
            // =============================================
            // CREATE BOT WIZARD COMPONENT
            // =============================================
            
            function CreateBotWizard() {
                const [step, setStep] = useState(1);
                const [formData, setFormData] = useState({
                    name: '', ageRange: '', personality: '', speechStyle: 'casual', 
                    backstory: '', exampleDialogue: '[{"user": "Hello!", "bot": "Hey there!"}]', extraRules: '', explicitContentMode: 'fully_filtered'
                });
                
                // Step 1: Basic Info
                function renderStep1() {
                    return (
                        <div className="space-y-6">
                            <h2 className="text-2xl font-bold text-gray-800">Step 1: Bot Basics</h2>
                            
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Bot Name *</label>
                                <input 
                                    type="text"
                                    value={formData.name}
                                    onChange={(e) => setFormData({...formData, name: e.target.value})}
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                    placeholder="e.g., My Persona Bot"
                                />
                            </div>
                            
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Age Range (optional)</label>
                                <input 
                                    type="text"
                                    value={formData.ageRange}
                                    onChange={(e) => setFormData({...formData, ageRange: e.target.value})}
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                    placeholder="e.g., 18-25, or any age range"
                                />
                            </div>
                            
                            <div className="mt-6 flex justify-end space-x-4">
                                <button 
                                    onClick={() => setStep(2)}
                                    className="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700"
                                >
                                    Next Step →
                                </button>
                            </div>
                        </div>
                    );
                }
                
                // Step 2: Personality & Speech Style
                function renderStep2() {
                    return (
                        <div className="space-y-6">
                            <h2 className="text-2xl font-bold text-gray-800">Step 2: Personality & Voice</h2>
                            
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Speech Style *</label>
                                <select 
                                    value={formData.speechStyle}
                                    onChange={(e) => setFormData({...formData, speechStyle: e.target.value})}
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                >
                                    <option value="casual">Casual & Friendly</option>
                                    <option value="formal">Formal & Professional</option>
                                    <option value="poetic">Poetic & Lyrical</option>
                                    <option value="sarcastic">Sarcastic & Witty</option>
                                    <option value="energetic">Energetic & Enthusiastic</option>
                                    <option value="mysterious">Mysterious & Intriguing</option>
                                </select>
                            </div>
                            
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Personality Traits *</label>
                                <textarea 
                                    value={formData.personality}
                                    onChange={(e) => setFormData({...formData, personality: e.target.value})}
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 h-32"
                                    placeholder="e.g., optimistic, curious, empathetic, playful, creative... Describe their personality in detail."
                                />
                            </div>
                            
                            <div className="mt-6 flex justify-between">
                                <button 
                                    onClick={() => setStep(1)}
                                    className="px-6 py-3 rounded-lg font-semibold border border-gray-300 hover:bg-gray-50"
                                >
                                    ← Previous
                                </button>
                                <button 
                                    onClick={() => setStep(3)}
                                    className="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700"
                                >
                                    Next Step →
                                </button>
                            </div>
                        </div>
                    );
                }
                
                // Step 3: Backstory & Examples
                function renderStep3() {
                    return (
                        <div className="space-y-6">
                            <h2 className="text-2xl font-bold text-gray-800">Step 3: Background & Dialogue</h2>
                            
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Backstory (optional)</label>
                                <textarea 
                                    value={formData.backstory}
                                    onChange={(e) => setFormData({...formData, backstory: e.target.value})}
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 h-32"
                                    placeholder="Describe their history, motivations, and what makes them unique..."
                                />
                            </div>
                            
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Example Dialogue (JSON array)</label>
                                <textarea 
                                    value={formData.exampleDialogue}
                                    onChange={(e) => setFormData({...formData, exampleDialogue: e.target.value})}
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 h-24 font-mono text-sm"
                                    placeholder='[{"user": "Hello!", "bot": "Hey there!"}, {"user": "How are you?", "bot": "I\'m great, thanks for asking!"}]'
                                />
                                <p className="text-xs text-gray-500 mt-2">Format: [{"user": "...", "bot": "..."}]</p>
                            </div>
                            
                            <div className="mt-6 flex justify-between">
                                <button 
                                    onClick={() => setStep(2)}
                                    className="px-6 py-3 rounded-lg font-semibold border border-gray-300 hover:bg-gray-50"
                                >
                                    ← Previous
                                </button>
                                <button 
                                    onClick={() => setStep(4)}
                                    className="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700"
                                >
                                    Next Step →
                                </button>
                            </div>
                        </div>
                    );
                }
                
                // Step 4: Content Mode & Rules
                function renderStep4() {
                    return (
                        <div className="space-y-6">
                            <h2 className="text-2xl font-bold text-gray-800">Step 4: Content Settings</h2>
                            
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Explicit Content Mode *</label>
                                <select 
                                    value={formData.explicitContentMode}
                                    onChange={(e) => setFormData({...formData, explicitContentMode: e.target.value})}
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                >
                                    <option value="fully_filtered">Fully Filtered (SFW-only)</option>
                                    <option value="mature">Mature (Artistic/Contextual)</option>
                                    <option value="explicit">Explicit (Full Freedom)</option>
                                </select>
                                
                                <p className="text-xs text-gray-500 mt-2">
                                    No restrictions on what users can add as personality! Choose your preferred mode.
                                </p>
                            </div>
                            
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Extra Rules & Constraints (optional)</label>
                                <textarea 
                                    value={formData.extraRules}
                                    onChange={(e) => setFormData({...formData, extraRules: e.target.value})}
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 h-24"
                                    placeholder="e.g., \"Always respond with humor\", \"Never mention politics\"..."
                                />
                            </div>
                            
                            <div className="mt-6 flex justify-between">
                                <button 
                                    onClick={() => setStep(3)}
                                    className="px-6 py-3 rounded-lg font-semibold border border-gray-300 hover:bg-gray-50"
                                >
                                    ← Previous
                                </button>
                                <button 
                                    onClick={createBot}
                                    className="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700"
                                >
                                    Create Bot! ✨
                                </button>
                            </div>
                        </div>
                    );
                }
                
                // Create bot in database
                async function createBot() {
                    const payload = {
                        name: formData.name,
                        ageRange: formData.ageRange || null,
                        personality: formData.personality || '',
                        speechStyle: formData.speechStyle,
                        backstory: formData.backstory || '',
                        exampleDialogue: JSON.parse(formData.exampleDialogue),
                        extraRules: formData.extraRules || '',
                        explicitContentMode: formData.explicitContentMode
                    };
                    
                    try {
                        await axios.post(`${API_BASE}/bots`, payload, {
                            headers: { Authorization: `Bearer ${localStorage.getItem('token')}` }
                        });
                        
                        alert('✅ Bot created successfully!');
                        loadBots();
                        setView('dashboard');
                    } catch (error) {
                        console.error('Failed to create bot:', error);
                    }
                }
                
                // Render appropriate step
                const currentStep = [renderStep1, renderStep2, renderStep3, renderStep4][step - 1]();
                
                return (
                    <div className="bg-white rounded-2xl shadow-xl p-8 animate-fade-in">
                        <div className="text-center mb-8">
                            <h2 className="text-3xl font-bold text-gray-800">🎭 Create New Persona Bot</h2>
                            <p className="text-gray-600 mt-2">Follow the wizard to set up your AI chatbot!</p>
                        </div>
                        
                        <div className="mb-6 flex justify-center space-x-4">
                            {['Basic Info', 'Personality & Voice', 'Background & Dialogue', 'Content Settings'].map((label, index) => (
                                <span 
                                    key={index}
                                    className={`px-4 py-2 rounded-full font-semibold ${step > index ? 'bg-green-100 text-green-700' : step === index ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-500'}`}
                                >
                                    {index + 1}. {label}
                                </span>
                            ))}
                        </div>
                        
                        <div className="border-t border-gray-200 py-8">
                            {currentStep}
                        </div>
                    </div>
                );
            }
            
            // =============================================
            // EDIT BOT COMPONENT
            // =============================================
            
            function EditBotForm() {
                if (!selectedBot) return null;
                
                return (
                    <div className="bg-white rounded-2xl shadow-xl p-8 animate-fade-in">
                        <h2 className="text-3xl font-bold text-gray-800 mb-6 flex items-center">
                            ✏️ Edit Bot: {selectedBot.name}
                        </h2>
                        
                        <div className="grid md:grid-cols-2 gap-6">
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Name</label>
                                    <input 
                                        type="text"
                                        value={selectedBot.name}
                                        onChange={(e) => console.log('Updating name:', e.target.value)}
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                    />
                                </div>
                                
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Age Range</label>
                                    <input 
                                        type="text"
                                        value={selectedBot.ageRange}
                                        onChange={(e) => console.log('Updating age range:', e.target.value)}
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                    />
                                </div>
                                
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Speech Style</label>
                                    <input 
                                        type="text"
                                        value={selectedBot.speechStyle}
                                        onChange={(e) => console.log('Updating speech style:', e.target.value)}
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                    />
                                </div>
                                
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Explicit Content Mode</label>
                                    <select 
                                        value={selectedBot.explicitContentMode}
                                        onChange={(e) => console.log('Updating content mode:', e.target.value)}
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                    >
                                        <option value="fully_filtered">Fully Filtered (SFW-only)</option>
                                        <option value="mature">Mature (Artistic/Contextual)</option>
                                        <option value="explicit">Explicit (Full Freedom)</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Personality</label>
                                    <textarea 
                                        value={selectedBot.personality}
                                        onChange={(e) => console.log('Updating personality:', e.target.value)}
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 h-32"
                                    />
                                </div>
                                
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Backstory</label>
                                    <textarea 
                                        value={selectedBot.backstory}
                                        onChange={(e) => console.log('Updating backstory:', e.target.value)}
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 h-32"
                                    />
                                </div>
                            </div>
                        </div>
                        
                        <div className="mt-6 flex justify-between">
                            <button 
                                onClick={() => { loadBots(); setView('dashboard'); }}
                                className="px-6 py-3 rounded-lg font-semibold bg-gray-200 text-gray-700 hover:bg-gray-300"
                            >
                                ← Cancel
                            </button>
                            
                            <button 
                                onClick={saveBot}
                                className="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700"
                            >
                                Save Changes ✓
                            </button>
                        </div>
                    </div>
                );
            }
            
            function saveBot() {
                // In production, send PUT request to /api/bots/:id
                alert('✏️ Bot updated successfully!');
                loadBots();
                setView('dashboard');
            }
            
            // =============================================
            // DISCORD SETUP GUIDE COMPONENT
            // =============================================
            
            function DiscordSetupGuide() {
                return (
                    <div className="bg-white rounded-2xl shadow-xl p-8 animate-fade-in">
                        <h2 className="text-3xl font-bold text-gray-800 mb-6 flex items-center">
                            📋 Discord Bot Setup Guide (1-Click Invite!)
                        </h2>
                        
                        <div className="space-y-6">
                            {['Step 1: Open the Discord Developer Portal', 'Step 2: Create New Application', 'Step 3: Go to Bot Page', 'Step 4: Reset Token and Enable Message Content Intent'].map((step, index) => (
                                <div key={index} className="flex items-start space-x-4 p-4 bg-gray-50 rounded-lg">
                                    <span className="text-2xl font-bold text-blue-600">{index + 1}</span>
                                    <p className="text-gray-700 flex-1">{step}</p>
                                </div>
                            ))}
                            
                            {/* Invite Button */}
                            <div className="mt-8 bg-gradient-to-r from-green-500 to-teal-600 text-white p-8 rounded-2xl shadow-lg">
                                <h3 className="text-2xl font-bold mb-4 flex items-center">
                                    ✨ Invite to Server (1-Click!)
                                </h3>
                                
                                {/* In production, this would be generated from bot's application ID */}
                                <button 
                                    onClick={() => {
                                        navigator.clipboard.writeText('https://discord.com/oauth2/authorize?client_id=YOUR_APP_ID&scope=bot&permissions=8');
                                        alert('Invite link copied to clipboard! Paste in your browser.');
                                    }}
                                    className="bg-white text-green-700 px-8 py-4 rounded-xl font-bold hover:bg-gray-100 transition"
                                >
                                    Copy & Open Invite Link →
                                </button>
                                
                                <p className="mt-4 opacity-90">
                                    The link will open Discord's OAuth2 page where you can authorize the bot for your server!
                                </p>
                            </div>
                        </div>
                    </div>
                );
            }
            
            // =============================================
            // RENDER APP LAYOUT
            // =============================================
            
            if (!user) {
                const isRegister = view === 'register';
                return isRegister ? &lt;RegisterForm /&gt; : &lt;LoginForm /&gt;;
            }
            
            return (
                <div className="min-h-screen bg-gray-100">
                    {/* Top Navigation */}
                    <nav className="bg-white shadow-sm border-b border-gray-200">
                        <div className="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
                            <h1 className="text-2xl font-bold text-blue-600">🤖 Discord Persona Platform</h1>
                            
                            <div className="flex space-x-4">
                                {/* View Navigation */}
                                {['dashboard', 'create-bot'].map(viewName => (
                                    <button 
                                        key={viewName}
                                        onClick={() => setView(viewName)}
                                        className={`px-4 py-2 rounded-lg font-semibold ${view === viewName ? 'bg-blue-100 text-blue-700' : 'text-gray-600 hover:bg-gray-100'}`}
                                    >
                                        {viewName.replace('-', ' ').replace(/-/g, ' ')}
                                    </button>
                                ))}
                                
                                <button 
                                    onClick={() => setView('memories')}
                                    className={`px-4 py-2 rounded-lg font-semibold ${view === 'memories' ? 'bg-purple-100 text-purple-700' : 'text-gray-600 hover:bg-gray-100'}`}
                                >
                                    🧠 Memories
                                </button>
                                
                                <button 
                                    onClick={() => setView('settings')}
                                    className={`px-4 py-2 rounded-lg font-semibold ${view === 'settings' ? 'bg-green-100 text-green-700' : 'text-gray-600 hover:bg-gray-100'}`}
                                >
                                    ⚙️ Settings
                                </button>
                            </div>
                        </div>
                    </nav>
                    
                    {/* Main Content */}
                    <main className="max-w-7xl mx-auto px-6 py-8">
                        {view === 'dashboard' && &lt;DashboardHome /&gt;}
                        
                        {view === 'create-bot' && &lt;CreateBotWizard /&gt;}
                        
                        {view.startsWith('edit-bot') && &lt;EditBotForm /&gt;}
                        
                        {view === 'chat-preview' || view.startsWith('chat-preview-') && (
                            <ChatPreviewView botId={view.includes('-') ? view.replace('chat-preview-', '') : null} />
                        )}
                        
                        {view === 'memories' && &lt;MemoriesManager /&gt;}
                        
                        {view === 'settings' && &lt;SettingsPanel /&gt;}
                        
                        {view === 'discards' && (
                            <div className="text-center py-20">
                                <h2 className="text-3xl font-bold text-gray-800 mb-4">🔒 This feature is coming soon!</h2>
                                <p className="text-gray-600 mb-6">Memory management will be available in the next update.</p>
                            </div>
                        )}
                    </main>
                </div>
            );
        }
        
        // =============================================
        // CHAT PREVIEW VIEW (For testing bot responses)
        // =============================================
        
        function ChatPreviewView({ botId }) {
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            
            async function sendMessage() {
                if (!input.trim()) return;
                
                setMessages(prev => [...prev, { role: 'user', content: input }]);
                setInput('');
                setLoading(true);
                
                try {
                    // Simulate bot response (replace with actual API call)
                    setTimeout(() => {
                        setMessages(prev => [...prev, { 
                            role: 'bot', 
                            content: 'Hello! How can I help you today? 🤖' 
                        }]);
                        setLoading(false);
                    }, 1000);
                } catch (error) {
                    console.error('Error:', error);
                    setLoading(false);
                }
            }
            
            return (
                <div className="bg-white rounded-2xl shadow-xl h-[calc(100vh-180px)] flex animate-fade-in">
                    {/* Messages Area */}
                    <div className="flex-1 p-6 overflow-y-auto space-y-4">
                        {messages.length === 0 && (
                            <div className="text-center text-gray-500 mt-20">
                                <p>Start chatting with your bot below!</p>
                            </div>
                        )}
                        
                        {messages.map((msg, index) => (
                            <div 
                                key={index}
                                className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'} animate-fade-in`}
                            >
                                <div 
                                    className={`max-w-[70%] p-4 rounded-2xl chat-bubble ${
                                        msg.role === 'user' 
                                            ? 'bg-blue-600 text-white rounded-br-sm' 
                                            : 'bg-gray-100 text-gray-800 rounded-bl-sm'
                                    }`}
                                >
                                    <p>{msg.content}</p>
                                </div>
                            </div>
                        ))}
                        
                        {loading && (
                            <div className="flex justify-start animate-fade-in">
                                <div className="bg-gray-100 text-gray-800 p-4 rounded-2xl rounded-bl-sm max-w-[70%]">
                                    <p>💬 Bot is thinking...</p>
                                </div>
                            </div>
                        )}
                    </div>
                    
                    {/* Input Area */}
                    <div className="border-t border-gray-200 p-4 bg-gray-50">
                        <form onSubmit={(e) => { e.preventDefault(); sendMessage(); }}>
                            <input 
                                type="text"
                                value={input}
                                onChange={(e) => setInput(e.target.value)}
                                placeholder="Type your message..."
                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                            />
                            <button 
                                type="submit"
                                disabled={!input.trim() || loading}
                                className="mt-2 bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 disabled:opacity-50"
                            >
                                Send Message
                            </button>
                        </form>
                    </div>
                </div>
            );
        }
        
        // =============================================
        // MEMORIES MANAGER (Placeholder)
        // =============================================
        
        function MemoriesManager() {
            return (
                <div className="bg-white rounded-2xl shadow-xl p-8 animate-fade-in">
                    <h2 className="text-3xl font-bold text-gray-800 mb-6 flex items-center">
                        🧠 Memory Manager
                    </h2>
                    
                    <div className="space-y-6">
                        <div className="bg-blue-50 border border-blue-200 rounded-xl p-6">
                            <p className="text-blue-800 font-semibold mb-2">💡 About Memories</p>
                            <p className="text-blue-700">
                                Long-term memories are automatically generated from your conversations. 
                                You can view, edit, or delete them through this interface.
                            </p>
                        </div>
                        
                        {/* Memory list placeholder */}
                        <div className="border border-gray-200 rounded-xl p-8 text-center text-gray-500">
                            <p>No memories loaded yet.</p>
                            <p className="text-sm mt-2">Memories will appear as conversations with your bot begin.</p>
                        </div>
                    </div>
                </div>
            );
        }
        
        // =============================================
        // SETTINGS PANEL (Explicit Content Mode Toggle)
        // =============================================
        
        function SettingsPanel() {
            return (
                <div className="bg-white rounded-2xl shadow-xl p-8 animate-fade-in">
                    <h2 className="text-3xl font-bold text-gray-800 mb-6 flex items-center">
                        ⚙️ Dashboard Settings
                    </h2>
                    
                    <div className="space-y-8">
                        {/* Content Mode Setting */}
                        <div>
                            <h3 className="text-xl font-semibold text-gray-800 mb-4">🔒 Explicit Content Mode</h3>
                            
                            <select 
                                className="w-full max-w-md px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                defaultValue={bots[0]?.explicitContentMode || 'fully_filtered'}
                            >
                                <option value="fully_filtered">Fully Filtered (SFW-only)</option>
                                <option value="mature">Mature (Artistic/Contextual)</option>
                                <option value="explicit">Explicit (Full Freedom)</option>
                            </select>
                            
                            <p className="text-sm text-gray-600 mt-3">
                                This setting controls what content the bot can discuss. Choose based on your needs!
                            </p>
                        </div>
                        
                        {/* Memory Window Size */}
                        <div>
                            <h3 className="text-xl font-semibold text-gray-800 mb-4">🪟 Short-Term Memory Window</h3>
                            
                            <input 
                                type="number"
                                defaultValue={50}
                                min={10}
                                max={1000}
                                className="w-full max-w-md px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                            />
                            
                            <p className="text-sm text-gray-600 mt-3">
                                Number of recent messages to remember (sliding window). Default: 50
                            </p>
                        </div>
                        
                        {/* Memory Auto-Expire */}
                        <div>
                            <h3 className="text-xl font-semibold text-gray-800 mb-4">🕒 Memory Auto-Expire</h3>
                            
                            <input 
                                type="number"
                                defaultValue={72}
                                min={1}
                                max={168}
                                className="w-full max-w-md px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                            />
                            
                            <p className="text-sm text-gray-600 mt-3">
                                Hours before messages automatically expire from short-term memory. Default: 72 hours
                            </p>
                        </div>
                    </div>
                    
                    <div className="mt-8 flex justify-end">
                        <button 
                            onClick={() => alert('Settings saved!')}
                            className="bg-green-600 text-white px-8 py-3 rounded-lg font-semibold hover:bg-green-700"
                        >
                            Save Settings ✓
                        </button>
                    </div>
                </div>
            );
        }
        
        // =============================================
        // INITIALIZE APP
        // =============================================
        
        const appRoot = document.getElementById('root');
        const root = ReactDOM.createRoot(appRoot);
        root.render(&lt;App /&gt;);
    </script>
</body>
</html>
